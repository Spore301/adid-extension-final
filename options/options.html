<!DOCTYPE html>
<html>
<head>
  <title>ADID Taskmanager Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <div class="setting-card">
      <h2>Backend Environment</h2>
      <p>Select which server the extension should connect to.</p>
      <div class="radio-group">
        <label>
          <input type="radio" name="backend" value="http://192.168.1.5:8000">
          Development (Local)
        </label>
        <label>
          <input type="radio" name="backend" value="https://adid-task-manager.onrender.com">
          Production (Live)
        </label>
      </div>
    </div>

    <div class="setting-card">
      <h2>Appearance</h2>
      <p>Choose your preferred theme.</p>
      <div class="toggle-switch">
        <label class="switch">
          <input type="checkbox" id="theme-toggle">
          <span class="slider round"></span>
        </label>
        <label for="theme-toggle" id="theme-label">Light Mode</label>
      </div>
    </div>
    
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
