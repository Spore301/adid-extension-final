<!DOCTYPE html>
<html>
<head>
  <title>ADID Taskmanager Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <div class="setting-group">
      <h2>Backend Server</h2>
      <div class="radio-group">
        <label>
          <input type="radio" name="backend" value="http://localhost:5000">
          Development (Local)
        </label>
        <label>
          <input type="radio" name="backend" value="https://adid-task-manager.onrender.com">
          Production (Render)
        </label>
         </div>
    </div>
    
    <div class="setting-group">
      <h2>Music Service</h2>
      <div class="radio-group">
        <label>
          <input type="radio" name="music_backend" value="http://localhost:5001">
          Local Music Service
        </label>
        <label>
          <input type="radio" name="music_backend" value="https://your-music-backend.vercel.app"> Production Music Service
        </label>
      </div>
    </div>
    
    <div id="status"></div>
    
  </div>
  

  <script src="options.js"></script>
</body>
</html>
